  <style>
    html,
    body {
      margin: 0;

    /* Branded loader shown while Flutter downloads and boots. */
    #mf-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, .06), #0B0B0B 55%);
      transition: opacity .5s ease, visibility .5s ease;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #mf-loader.done {
      opacity: 0;
      visibility: hidden;
    }

    .mf-mark {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: #F5F5F5;
      color: #0B0B0B;
      font: 700 30px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -1px;
      box-shadow: 0 0 40px rgba(255, 255, 255, .12);
      animation: mf-float 1.6s ease-in-out infinite;
    }

    .mf-mark::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 30px;
      border: 1px solid rgba(245, 245, 245, .35);
      animation: mf-ring 1.6s ease-out infinite;
    }

    .mf-bar {
      width: 140px;
      height: 2px;
      border-radius: 2px;
      background: #2A2A2A;
      overflow: hidden;
    }

    .mf-bar::before {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #F5F5F5;
      animation: mf-slide 1.1s ease-in-out infinite;
    }

    .mf-label {
      color: #5C5C5C;
      font-size: 11px;
      letter-spacing: 3px;
    }

    @keyframes mf-float {
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes mf-ring {
      from {
        transform: scale(.9);
        opacity: 1;
      }

      to {
        transform: scale(1.35);
        opacity: 0;
      }
    }

    @keyframes mf-slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(250%);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .mf-mark,
      .mf-mark::after,
      .mf-bar::before {
        animation: none;
      }
    }
  </style>
</head>
